<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Clinical Decision Support</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>🩺 AI Clinical Decision Support System</h1>
    <p class="subtitle">Enter patient details to get AI‑assisted diagnosis</p>

    <form method="POST" class="card">

        <div class="form-grid">
            <div>
                <label>Age</label>
                <input type="number" name="age" required>
            </div>

            <div>
                <label>Gender</label>
                <select name="gender">
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div>
                <label>Fever</label>
                <select name="fever">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div>
                <label>Cough</label>
                <select name="cough">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div>
                <label>Fatigue</label>
                <select name="fatigue">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div>
                <label>Blood Pressure</label>
                <input type="number" name="bp" placeholder="e.g. 120">
            </div>

            <div>
                <label>Glucose Level</label>
                <input type="number" name="glucose" placeholder="e.g. 90">
            </div>

            <div>
                <label>Cholesterol</label>
                <input type="number" name="cholesterol" placeholder="e.g. 180">
            </div>

            <div>
                <label>BMI</label>
                <input type="number" step="0.1" name="bmi" placeholder="e.g. 24.5">
            </div>

            <div>
                <label>Smoking</label>
                <select name="smoking">
                    <option value="1">Smoker</option>
                    <option value="0">Non‑Smoker</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn">🔍 Analyze Patient</button>

    </form>

    <p class="disclaimer">
        ⚠️ This system is a clinical decision support tool and does not replace a medical professional.
    </p>
</div>

</body>
</html>
